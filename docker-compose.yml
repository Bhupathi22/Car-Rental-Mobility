version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: mobility_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: car_rental_mobility
    volumes:
      - mongo_data:/data/db

  # Backend REST API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobility_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/car_rental_mobility
      - JWT_SECRET=car_rental_mobility_super_secret_jwt_key_2025_academics
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  # Frontend Web Client Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mobility_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
